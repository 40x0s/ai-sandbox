name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atelier
          POSTGRES_PASSWORD: atelier
          POSTGRES_DB: atelier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atelier -d atelier"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://atelier:atelier@localhost:5432/atelier
      AUTH_SECRET: ci-only-secret-value-at-least-32-characters-long
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Applies the committed SQL directly, so CI never depends on Prisma's
      # engine download host.
      - name: Prepare database
        run: npm run db:setup

      - name: Build
        run: npm run build

      - name: Start the app
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/ > /dev/null && echo "ready after ${i}s" && exit 0
            sleep 1
          done
          echo "server did not become ready" && exit 1

      - name: End-to-end tests
        run: npm test

      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/dev.log
