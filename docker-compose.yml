services:
  storefront:
    build: .
    ports:
      - '3000:3000'
    environment:
      # Generate with: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in your shell or a .env file (openssl rand -base64 32)}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      DATABASE_URL: file:/app/data/atelier.db
    volumes:
      - atelier-data:/app/data
    restart: unless-stopped

volumes:
  atelier-data:
